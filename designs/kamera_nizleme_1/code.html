<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invoice2Sheet - Camera &amp; Preview</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#aeb9d0",
                        "on-tertiary": "#233144",

                        "surface-bright": "#31394d",
                        "on-secondary-fixed-variant": "#3c475a",
                        "secondary": "#bcc7de",
                        "on-tertiary-fixed": "#0d1c2f",
                        "surface-dim": "#0b1326",
                        "on-primary": "#003827",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "tertiary-fixed": "#d5e3fd",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#2d3449",
                        "secondary-container": "#3e495d",
                        "surface": "#0b1326",
                        "primary-fixed": "#a6f2cf",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#d8e3fb",
                        "inverse-surface": "#dae2fd",

                        "on-error": "#690005",
                        "secondary-fixed-dim": "#bcc7de",
                        "tertiary": "#ffffff",
                        "on-primary-container": "#247155",
                        "on-surface-variant": "#bec9c2",
                        "surface-container-highest": "#2d3449",
                        "surface-container-high": "#222a3d",
                        "on-secondary": "#263143",
                        "background": "#0b1326",
                        "primary": "#ffffff",
                        "surface-tint": "#8bd6b4",
                        "primary-fixed-dim": "#8bd6b4",
                        "on-secondary-fixed": "#111c2d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "gutter": "24px",
                        "lg": "24px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-md": ["Manrope"],
                        "label-lg": ["Inter"],
                        "display-lg": ["Manrope"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],

                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]

                },
            },
        }

<style>
        .skeleton-shimmer {
            background: linear-gradient(90deg, #171f33 25%, #8bd6b433 50%, #171f33 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-hidden">
<!-- Camera Viewport Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center overflow-hidden">
<!-- Live Viewfinder Image Mock -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="A POV perspective of a smartphone camera viewfinder focusing on a paper corporate invoice lying on a dark executive wooden desk. The lighting is focused and cinematic, creating a professional and high-stakes atmosphere. The UI elements of the camera are minimal and clinical, following a modern productive minimalism aesthetic with clean lines and high contrast. The invoice details are visible but softly blurred at the edges, emphasizing the central extraction point." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0hlJnYsnqsF4UogsuQgQ-pJWi1lCgemY2g68nxAfWUU09UhsRl7tZI20IARko2E9jr2mnzWylzf73AOmnFuIZEBsIF7XrtP7ZMYcJdAJY3jRjFOD_V-zJuWdsF66DcsWGVtTFhqNt5ssKD039lrZpJvSRKbTewoBmFVFJGhaE-5qzyv4JR4ctT7QScj7SN99Y1ebGB_ZuN6i5bNhDSNMTk9GXKIxzDC2-pHj-q5B_D2fnFPi28rqL6xHt13F2-T1j56jhl_HVj70"/>
</div>
<!-- Scanning Frame Overlay -->
<div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
<div class="w-4/5 h-3/5 border-2 border-primary-fixed-dim/30 rounded-xl">
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
</div>
<!-- Top Bar Controls -->
<nav class="absolute top-0 w-full z-20 flex justify-between items-center p-gutter h-16">
<button class="w-10 h-10 flex items-center justify-center bg-black/50 backdrop-blur-md text-white rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex gap-4">
<button class="w-10 h-10 flex items-center justify-center bg-black/50 backdrop-blur-md text-white rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
<button class="w-10 h-10 flex items-center justify-center bg-black/50 backdrop-blur-md text-white rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
</div>
</nav>
<!-- Bottom Shutter Area -->
<div class="absolute bottom-0 w-full z-20 bg-gradient-to-t from-black/90 to-transparent pt-12 pb-10 flex flex-col items-center">
<div class="flex items-center justify-around w-full max-w-md px-10">
<div class="w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center border border-white/20 backdrop-blur-md">
<span class="text-white font-label-sm">AUTO</span>
</div>
<button class="w-20 h-20 bg-white rounded-full p-1 border-4 border-white/20 active:scale-90 duration-150">
<div class="w-full h-full rounded-full border-2 border-black/10"></div>
</button>
<div class="w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center border border-white/20 backdrop-blur-md">
<span class="material-symbols-outlined text-white" data-icon="history">history</span>
</div>
</div>
<p class="mt-4 text-white/80 font-label-lg tracking-wider">ALIGN INVOICE WITHIN FRAME</p>
</div>
<!-- PROCESSING OVERLAY -->
<div class="absolute inset-0 z-30 bg-surface/90 backdrop-blur-md flex flex-col items-center justify-center px-margin-mobile">
<div class="w-full max-w-sm space-y-8">
<!-- Status Header -->
<div class="text-center space-y-2">
<div class="inline-flex items-center gap-3 text-white">
<span class="material-symbols-outlined animate-spin text-primary-fixed-dim" data-icon="progress_activity">progress_activity</span>
<h2 class="font-title-lg text-title-lg">İşleniyor...</h2>
</div>
<p class="text-on-surface-variant font-body-md">Veriler tablonuz için ayıklanıyor</p>
</div>
<!-- Skeleton Cards -->
<div class="grid grid-cols-2 gap-3">
<div class="col-span-2 h-24 rounded-xl bg-surface-container-high skeleton-shimmer border border-outline-variant/30 flex flex-col p-4 space-y-3">
<div class="h-4 w-1/3 bg-surface-variant rounded-full"></div>
<div class="h-6 w-2/3 bg-surface-variant rounded-full"></div>
</div>
<div class="h-32 rounded-xl bg-surface-container-high skeleton-shimmer border border-outline-variant/30 flex flex-col p-4 space-y-3">
<div class="h-3 w-1/2 bg-surface-variant rounded-full"></div>
<div class="h-5 w-full bg-surface-variant rounded-full"></div>
<div class="mt-auto h-2 w-full bg-surface-variant rounded-full opacity-30"></div>
</div>
<div class="h-32 rounded-xl bg-surface-container-high skeleton-shimmer border border-outline-variant/30 flex flex-col p-4 space-y-3">
<div class="h-3 w-2/3 bg-surface-variant rounded-full"></div>
<div class="h-5 w-1/2 bg-surface-variant rounded-full"></div>
<div class="mt-auto h-2 w-full bg-surface-variant rounded-full opacity-30"></div>
</div>
<div class="col-span-2 h-16 rounded-xl bg-surface-container-high skeleton-shimmer border border-outline-variant/30 flex items-center justify-between px-4">
<div class="h-4 w-1/4 bg-surface-variant rounded-full"></div>
<div class="h-6 w-1/3 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Progress Detail Indicator -->
<div class="space-y-3">
<div class="flex justify-between font-label-sm text-on-surface px-1">
<span class="uppercase tracking-widest text-[10px]">OCR ANALİZİ</span>
<span class="font-bold">65%</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-[65%] bg-primary-fixed-dim rounded-full shadow-[0_0_8px_rgba(139,214,180,0.5)]"></div>
</div>
</div>
<!-- Cancel Button -->
<div class="pt-4 flex justify-center">
<button class="px-8 py-3 rounded-full border border-outline/50 text-white font-label-lg hover:bg-surface-container-high active:scale-95 transition-all">
                    İptal Et
                </button>
</div>
</div>
</div>
</main>
</body></html>
